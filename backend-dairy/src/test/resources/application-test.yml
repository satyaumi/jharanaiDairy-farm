server:
  port: 0

spring:
  application:
    name: dairy-farm-backend-test
  datasource:
    url: jdbc:h2:mem:dairy_farm_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: dairyfarm_jwt_super_secure_secret_key_minimum_256_bits_length_for_hmac_sha256
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:8081

resend:
  api-key: ""
  from-email: Jharanai Farm <onboarding@resend.dev>

logging:
  level:
    com.dairyfarm: DEBUG
    org.springframework.security: WARN
