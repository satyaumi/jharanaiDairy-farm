version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jharanai-postgres
    restart: always
    environment:
      POSTGRES_DB: Dairy-farm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Dairy-farm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-dairy
      dockerfile: Dockerfile
    container_name: jharanai-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/Dairy-farm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      PORT: 8085
      JWT_SECRET: dairyfarm_jwt_super_secure_secret_key_minimum_256_bits_length_for_hmac_sha256
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8085:8085"

volumes:
  postgres_data:
